services:
  db:
    image: postgres:16-alpine
    container_name: ik-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ik
      POSTGRES_USER: ik
      POSTGRES_PASSWORD: ik
    volumes:
      - ik-db-data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  ik-api:
    build: ./api
    container_name: ik-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ik:ik@db:5432/ik
      SMTP_SETTINGS_KEY: ${SMTP_SETTINGS_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://hr.adminpanel.space}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
    env_file:
      - ${BORDRO_ENV_FILE:-/dev/null}
    depends_on: [db]
  ik-web:
    build: .
    container_name: ik-web
    restart: unless-stopped
    # GÜVENLİK: bu portu yalnızca yerele bağlayın. Cloudflare Tunnel ingress
    # kuralını "http://127.0.0.1:8080" yapıp aşağıyı "127.0.0.1:8080:80" olarak
    # değiştirin; böylece uygulama LAN'dan (10.48.x:8080) doğrudan erişilemez,
    # yalnızca Cloudflare üzerinden gelir. (Tünel şu an 10.48.1.60:8080'e
    # baktığı için geçici olarak 0.0.0.0 bırakıldı.)
    ports:
      - "0.0.0.0:8080:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ik-db-data:
