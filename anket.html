<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>İK Merkezi · Anket</title>
<style>
  :root{--ink:#17233b;--muted:#72809a;--line:#e7ebf2;--bg:#f6f8fb;--card:#fff;--blue:#4967f4;--green:#18a874;--orange:#f59e0b;--red:#e55261}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 14px}
  .wrap{max-width:760px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;font-weight:800}
  .brand strong{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(35,48,80,.07);padding:24px}
  h1{font-size:20px;margin:0 0 6px}
  .desc{color:var(--muted);margin:0 0 20px}
  .state{text-align:center;padding:26px 10px}
  .state .ic{font-size:34px;display:block;margin-bottom:10px}
  .state h2{margin:0 0 6px;font-size:18px}
  .state p{color:var(--muted);margin:0}
  .q{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .q:last-of-type{border-bottom:0}
  .q-title{font-weight:650;margin-bottom:4px}
  .q-detail{color:var(--muted);font-size:13px;margin-bottom:10px}
  .req{color:var(--red)}
  .opt{display:flex;align-items:center;gap:10px;padding:7px 0}
  .opt input{width:17px;height:17px;flex:0 0 auto}
  textarea,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:70px;resize:vertical}
  .scale{display:flex;gap:14px;flex-wrap:wrap}
  .scale label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;cursor:pointer}
  .scale-lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;max-width:360px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .col{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfcfe}
  .col-head{font-weight:750;font-size:14px;margin-bottom:12px}
  .cand{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;margin-bottom:8px;cursor:pointer}
  .cand:last-child{margin-bottom:0}
  .cand.sel{border-color:var(--blue);background:#f2f5ff;box-shadow:0 0 0 1px var(--blue) inset}
  .cand input{flex:0 0 auto;width:17px;height:17px}
  .cand img,.cand .ph{width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;background:#e7ebff}
  .cand .ph{display:grid;place-items:center;color:var(--blue);font-weight:700}
  .cand b{display:block;font-size:14px}
  .cand small{color:var(--muted)}
  .btn{border:0;border-radius:9px;padding:12px 18px;background:var(--blue);color:#fff;font-weight:650;font-size:15px;cursor:pointer;margin-top:20px;width:100%}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .err{background:#ffeaed;color:#bf3547;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
  @media(max-width:640px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="brand-mark">İK</span><div><strong>İK Merkezi</strong><small>Anket & değerlendirme</small></div></div>
  <div class="card" id="root"><div class="state"><span class="ic">⏳</span><p>Yükleniyor…</p></div></div>
  <div class="foot">Bu bağlantı yalnızca bir kez kullanılabilir ve size özeldir.</div>
</div>
<script>
(function(){
  var root=document.getElementById('root');
  var token=new URLSearchParams(location.search).get('t')||'';
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var CATS=[['operasyon','Operasyon Çalışanları'],['idari','İdari Ofis Çalışanları']];

  function state(ic,title,msg){
    root.innerHTML='<div class="state"><span class="ic">'+ic+'</span><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div>';
  }
  function initials(n){return (String(n||'?').trim().split(/\s+/).map(function(w){return w[0]||''}).slice(0,2).join('')||'?').toLocaleUpperCase('tr-TR')}

  if(!token){state('⚠️','Bağlantı geçersiz','Bağlantı adresi eksik görünüyor.');return;}

  fetch('/api/public/invite/'+encodeURIComponent(token)).then(function(r){
    return r.json().then(function(d){return {ok:r.ok,status:r.status,d:d}});
  }).then(function(res){
    var d=res.d||{};
    if(!res.ok||d.status==='invalid'){state('⚠️','Bağlantı geçersiz','Bu bağlantı geçersiz veya kaldırılmış. Lütfen İK ile iletişime geçin.');return;}
    if(d.status==='closed'){state('🔒','Kapalı','Bu anket/oylama artık aktif değil.');return;}
    if(d.status==='used'){renderDone(d);return;}
    renderForm(d);
  }).catch(function(){state('⚠️','Bağlantı açılamadı','Sunucuya ulaşılamadı. Daha sonra tekrar deneyin.');});

  function renderDone(d){
    root.innerHTML='<div class="state"><span class="ic">✅</span><h2>Yanıtınız alındı</h2>'
      +'<p>Katılımınız için teşekkür ederiz'+(d.recipient_name?', '+esc(d.recipient_name):'')+'. Bu bağlantı tek kullanımlıktır; tekrar oy veya düzeltme yapılamaz.</p></div>';
  }

  function renderForm(d){
    var body='';
    if(d.kind==='personel'){
      body='<h1>'+esc(d.title||'Anket')+'</h1>'
        +(d.description?'<p class="desc">'+esc(d.description)+'</p>':'')
        +(d.questions||[]).map(qBlock).join('')
        +'<div id="err"></div><button class="btn" id="send">Yanıtları gönder</button>';
    }else{
      body='<h1>'+esc(d.title||'Ayın Personeli')+'</h1>'
        +'<p class="desc">Her sütundan yalnızca <strong>1</strong> aday seçebilirsiniz.</p>'
        +'<div class="cols">'+CATS.map(function(c){return colBlock(c[0],c[1],d.candidates||[])}).join('')+'</div>'
        +'<div id="err"></div><button class="btn" id="send">Oyumu gönder</button>';
    }
    root.innerHTML=body;
    wire(d);
  }

  function qBlock(q,i){
    var head='<div class="q-title">'+(i+1)+'. '+esc(q.title||'')+(q.required?' <span class="req">*</span>':'')+'</div>'
      +(q.detail?'<div class="q-detail">'+esc(q.detail)+'</div>':'');
    var ctl='';
    if(q.type==='text'){ctl='<textarea data-q="'+i+'" placeholder="Cevabınız…"></textarea>';}
    else if(q.type==='yesno'){ctl=['Evet','Hayır'].map(function(o){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+o+'"> '+o+'</label>'}).join('');}
    else if(q.type==='single'){ctl=(q.options||[]).map(function(o){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+esc(o.label)+'"> '+esc(o.label)+'</label>'}).join('');}
    else if(q.type==='multi'){ctl=(q.options||[]).map(function(o){return '<label class="opt"><input type="checkbox" data-q="'+i+'" value="'+esc(o.label)+'"> '+esc(o.label)+'</label>'}).join('');}
    else if(q.type==='scale'){
      var mn=Math.round(Number(q.scale_min)||1),mx=Math.round(Number(q.scale_max)||5),n=[];
      for(var k=mn;k<=mx&&n.length<21;k++)n.push(k);
      ctl='<div class="scale">'+n.map(function(v){return '<label><input type="radio" name="q'+i+'" value="'+v+'"><span>'+v+'</span></label>'}).join('')+'</div>'
        +((q.scale_min_label||q.scale_max_label)?'<div class="scale-lbl"><span>'+esc(q.scale_min_label||'')+'</span><span>'+esc(q.scale_max_label||'')+'</span></div>':'');
    }
    return '<div class="q" data-type="'+esc(q.type)+'" data-i="'+i+'" data-req="'+(q.required?1:0)+'">'+head+ctl+'</div>';
  }

  function colBlock(cat,label,cands){
    var list=cands.filter(function(c){return c.category===cat});
    var items=list.map(function(c){
      var pic=c.photo?'<img src="'+esc(c.photo)+'" alt="">':'<span class="ph">'+esc(initials(c.name))+'</span>';
      return '<label class="cand"><input type="radio" name="pick-'+cat+'" value="'+c.id+'">'+pic
        +'<span><b>'+esc(c.name)+'</b>'+(c.subtitle?'<small>'+esc(c.subtitle)+'</small>':'')+'</span></label>';
    }).join('')||'<p class="desc">Aday bulunmuyor.</p>';
    return '<div class="col"><div class="col-head">'+esc(label)+'</div>'+items+'</div>';
  }

  function wire(d){
    root.addEventListener('change',function(e){
      var lab=e.target.closest('label.cand');
      if(lab){var col=lab.closest('.col');[].forEach.call(col.querySelectorAll('label.cand'),function(x){x.classList.remove('sel')});
        if(e.target.checked)lab.classList.add('sel');}
    });
    var btn=document.getElementById('send'),errBox=document.getElementById('err');
    btn.onclick=function(){
      errBox.innerHTML='';
      var payload,i;
      if(d.kind==='personel'){
        var answers={};
        var blocks=root.querySelectorAll('.q');
        for(i=0;i<blocks.length;i++){
          var b=blocks[i],t=b.dataset.type,idx=b.dataset.i,req=b.dataset.req==='1',val;
          if(t==='text'){val=b.querySelector('textarea').value.trim();}
          else if(t==='multi'){val=[].filter.call(b.querySelectorAll('input:checked'),function(x){return x}).map(function(x){return x.value});}
          else{var c=b.querySelector('input:checked');val=c?c.value:'';}
          if(req&&(t==='multi'?!val.length:!val)){errBox.innerHTML='<div class="err">Lütfen '+(Number(idx)+1)+'. zorunlu soruyu yanıtlayın.</div>';b.scrollIntoView({block:'center'});return;}
          answers[idx]=val;
        }
        payload={answers:answers};
      }else{
        var picks={};
        var cols=root.querySelectorAll('.col');
        for(i=0;i<CATS.length;i++){
          var cat=CATS[i][0];
          if(!root.querySelector('.col label.cand'))break;
          var sel=root.querySelector('input[name="pick-'+cat+'"]:checked');
          var hasCands=!!root.querySelector('input[name="pick-'+cat+'"]');
          if(hasCands&&!sel){errBox.innerHTML='<div class="err">Her sütundan bir aday seçmelisiniz.</div>';return;}
          if(sel)picks[cat]=Number(sel.value);
        }
        payload={picks:picks};
      }
      btn.disabled=true;btn.textContent='Gönderiliyor…';
      fetch('/api/public/invite/'+encodeURIComponent(token),{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)
      }).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(res){
        if(res.ok){renderDone(d);return;}
        errBox.innerHTML='<div class="err">'+esc(res.j&&res.j.error||'Gönderilemedi')+'</div>';
        btn.disabled=false;btn.textContent=d.kind==='personel'?'Yanıtları gönder':'Oyumu gönder';
      }).catch(function(){
        errBox.innerHTML='<div class="err">Sunucuya ulaşılamadı.</div>';
        btn.disabled=false;btn.textContent=d.kind==='personel'?'Yanıtları gönder':'Oyumu gönder';
      });
    };
  }
})();
</script>
</body>
</html>
