# Güvenlik başlıkları — nginx'te bir location kendi add_header'ını tanımlarsa
# üst bloktakiler devre dışı kalır; bu yüzden ortak başlıklar bir dosyada
# tutulup gereken her location'a include ediliyor.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 3m;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location = /anket.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://ik-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-Visitor $http_cf_visitor;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location ~* \.(js|css)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
