# Güvenlik başlıkları — nginx'te bir location kendi add_header'ını tanımlarsa
# üst bloktakiler devre dışı kalır; bu yüzden ortak başlıklar bir dosyada
# tutulup gereken her location'a include ediliyor.

# CF-Connecting-IP / CF-Visitor istemcinin GÖNDERDİĞİ ham başlıklardır — Cloudflare
# Tunnel (cloudflared) bu sunucuya kendi LAN adresinden (10.48.1.60) veya
# loopback'ten bağlanıyor; ik-web portu (8080) LAN'a da açık olduğu için bu iki
# adres dışından gelen bir istek bu başlıkları serbestçe uydurabilir (ör. giriş
# kilidini IP başına sıfırlayıp kaba kuvvet korumasını atlatmak için). Yalnızca
# gerçekten cloudflared'ten geldiği doğrulanabilen isteklerde bu başlıkları
# olduğu gibi ilet; aksi halde boşalt — backend o zaman zaten doğrulanmış
# X-Forwarded-For / req.ip değerine düşer (bkz. server.js requestIp()).
geo $ik_trusted_tunnel_source {
  default     0;
  127.0.0.1   1;
  10.48.1.60  1;
}
map $ik_trusted_tunnel_source $ik_cf_connecting_ip {
  1       $http_cf_connecting_ip;
  default "";
}
map $ik_trusted_tunnel_source $ik_cf_visitor {
  1       $http_cf_visitor;
  default "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 3m;

  include /etc/nginx/snippets/security-headers.conf;

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location = /anket.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    client_max_body_size 30m;
    proxy_pass http://ik-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $ik_cf_connecting_ip;
    proxy_set_header CF-Visitor $ik_cf_visitor;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  # EYS dosya önizleme: PDF/DOCX kendi sayfamızda <iframe> içinde gösteriliyor —
  # genel security-headers.conf'taki X-Frame-Options DENY / frame-ancestors 'none'
  # bunu (aynı origin olsa bile) engeller. Yalnızca bu uç için same-origin çerçeveye izin ver.
  location /api/eys/file {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    client_max_body_size 30m;
    proxy_pass http://ik-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header CF-Connecting-IP $ik_cf_connecting_ip;
    proxy_set_header CF-Visitor $ik_cf_visitor;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  location ~* \.(js|css)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location ~* \.(woff2|woff|ttf)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
